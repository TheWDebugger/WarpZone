name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

# Builds against the Geode SDK version written in mod.json ("sdk: given"): 5.11.2, which
# targets Geometry Dash 2.2081 and uses a recent {fmt}. (SDK 4.0.0 pins fmt 11.0.2, which
# does not compile with the Clang that GitHub's runners now ship.)
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
      - uses: actions/upload-artifact@v4
        with:
          name: WarpZone-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}
